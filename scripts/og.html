<!doctype html>
<!-- Source of public/og.png (1200x630). Regenerate with `pnpm og`. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: Geist;
        src: url(../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2) format("woff2");
        font-weight: 100 900;
      }
      html, body { margin: 0; }
      body {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        box-sizing: border-box;
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: #0a0a0a radial-gradient(circle at 85% 20%, #262626 0, #0a0a0a 55%);
        color: #fafafa;
        font-family: Geist, sans-serif;
      }
      .brand { display: flex; align-items: center; gap: 18px; font-size: 32px; font-weight: 600; letter-spacing: -0.02em; }
      .brand img { width: 64px; height: 64px; }
      h1 { margin: 0; max-width: 640px; font-size: 68px; line-height: 1.04; font-weight: 700; letter-spacing: -0.04em; }
      h1 span { color: #a3a3a3; }
      .chips { display: flex; gap: 12px; }
      .chip { border: 1px solid #333; border-radius: 999px; padding: 10px 22px; font-size: 24px; color: #d4d4d4; }

      /* The logo's stacked cards, blown up */
      .card {
        position: absolute;
        width: 300px;
        height: 380px;
        border-radius: 28px;
        box-sizing: border-box;
        padding: 44px 36px;
      }
      .back { right: 64px; top: 70px; background: #404040; }
      .mid { right: 124px; top: 120px; background: #737373; }
      .front { right: 184px; top: 170px; background: #fafafa; }
      .line { height: 18px; border-radius: 9px; background: #171717; margin-bottom: 20px; }
      .short { width: 60%; background: #f97316; }
    </style>
  </head>
  <body>
    <div class="card back"></div>
    <div class="card mid"></div>
    <div class="card front">
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
      <div class="line short"></div>
    </div>
    <div class="brand"><img src="../public/logo.svg" alt="" />Article drafts</div>
    <h1>Write once.<br /><span>Preview and copy it for every platform.</span></h1>
    <div class="chips">
      <div class="chip">dev.to</div>
      <div class="chip">X Articles</div>
      <div class="chip">Medium</div>
    </div>
  </body>
</html>
